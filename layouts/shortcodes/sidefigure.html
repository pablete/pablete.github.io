{{- $id := .Get "id" | default (printf "sf-%s-%d" .Page.File.UniqueID .Ordinal) -}}
{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
<figure>
  <label for="{{ $id }}" class="margin-toggle">&#8853;</label>
  <input type="checkbox" id="{{ $id }}" class="margin-toggle"/>
  <span class="marginnote">{{ .Inner | .Page.RenderString | safeHTML }}</span>
  <img src="{{ $src | relURL }}" alt="{{ $alt }}"/>
</figure>
