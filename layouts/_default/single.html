{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ if .Params.subtitle }}
    <p class="subtitle">{{ .Params.subtitle }}</p>
  {{ else if not .Date.IsZero }}
    <p class="subtitle">{{ .Date.Format "January 2, 2006" }}</p>
  {{ end }}
  <section>
    {{ .Content }}
  </section>
  {{ with .Params.tags }}
    <p class="subtitle">Tags: {{ delimit . ", " }}</p>
  {{ end }}
{{ end }}
